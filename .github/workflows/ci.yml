name: DimAgent fork test APK

on:
  push:
    branches: ['release/v*-dima.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  android-apk:
    name: Build fork test APK
    if: github.repository == 'wht-github/ds-harness-remote' && startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter './packages/**' -r build

      - name: Check out Intelligent UI renderer source
        uses: actions/checkout@v7
        with:
          repository: dreamfarer-space/deepseek-harness-intelligent-ui
          # Pinned upstream PR #82 merge commit; update only after auditing the new artifact.
          ref: f3735efffd823f8c34817f4e8554743ac3276225
          path: .deps/deepseek-harness-intelligent-ui

      - name: Verify pinned Intelligent UI renderer
        run: |
          test "$(git -C .deps/deepseek-harness-intelligent-ui rev-parse HEAD)" = "f3735efffd823f8c34817f4e8554743ac3276225" || { echo '::error::Unexpected renderer source commit'; exit 1; }
          test "$(git -C .deps/deepseek-harness-intelligent-ui hash-object renderer/renderer.js)" = "ebac4a4c2199383458d4e1fa2121be0e6043c5c0" || { echo '::error::Unexpected renderer file content'; exit 1; }

      - name: Bundle local Android renderers
        env:
          DSH_INTELLIGENT_UI_RENDERER_BUNDLE: ${{ github.workspace }}/.deps/deepseek-harness-intelligent-ui/renderer/renderer.js
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: pnpm --dir apps/android run build:renderers

      - name: Verify bundled Android renderers
        env:
          DSH_REQUIRE_INTELLIGENT_UI: 'true'
        run: node packages/app-core/scripts/verify-intelligent-ui-renderer.mjs

      - name: Generate Android project
        run: pnpm --dir apps/android exec expo prebuild --platform android --no-install

      - name: Build release APK
        env:
          NODE_ENV: production
        run: |
          chmod +x apps/android/android/gradlew
          apps/android/android/gradlew \
            -p apps/android/android \
            :app:assembleRelease \
            --no-daemon \
            --build-cache \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Stage APK
        run: |
          mkdir -p artifacts/android
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk \
            artifacts/android/dsh-remote-android.apk

      - name: Verify installable test APK
        run: |
          apk=artifacts/android/dsh-remote-android.apk
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          version="$(node -p "require('./apps/android/app.json').expo.version")"
          code="$(node -p "require('./apps/android/app.json').expo.android.versionCode")"
          test "$GITHUB_REF_NAME" = "release/v$version"
          grep -F "package: name='io.github.liguobao.dshremote.dimatest' versionCode='$code' versionName='$version'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -Z1 "$apk" > "$RUNNER_TEMP/apk-entries.txt"
          grep -Fx assets/index.android.bundle "$RUNNER_TEMP/apk-entries.txt"
          grep '^lib/arm64-v8a/' "$RUNNER_TEMP/apk-entries.txt" > /dev/null
          grep '^lib/armeabi-v7a/' "$RUNNER_TEMP/apk-entries.txt" > /dev/null

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: dsh-remote-android-${{ github.sha }}
          path: artifacts/android/dsh-remote-android.apk
          if-no-files-found: error
          retention-days: 14
